name: Go 构建与测试
on:
  push:
    branches: [go]
  pull_request:
    branches: [go]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            suffix: ''
          - os: linux
            arch: arm64
            suffix: ''
          - os: windows
            arch: amd64
            suffix: '.exe'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - name: 编译原生可执行文件
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_SHA}" -o dist/chaoxing${{ matrix.suffix }} .
          cp config_template.ini LICENSE dist/
      - uses: actions/upload-artifact@v4
        with:
          name: chaoxing-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
